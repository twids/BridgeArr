name: Release and deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to release
        required: false
        default: master
      simulate_health_failure:
        description: Deploy the candidate, then force health verification to fail and test rollback
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  checks: read
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish and deploy
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'master' &&
         vars.AUTO_DEPLOY_ENABLED == 'true')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ vars.BRIDGEARR_HEALTH_URL }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/bridgearr
      DOCKHAND_URL: ${{ vars.DOCKHAND_URL }}
      DOCKHAND_ENV_ID: ${{ vars.DOCKHAND_ENV_ID }}
      DOCKHAND_GIT_STACK_ID: ${{ vars.DOCKHAND_GIT_STACK_ID }}
      DOCKHAND_TOKEN: ${{ secrets.DOCKHAND_TOKEN }}

    steps:
      - name: Resolve release commit
        id: commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_REF: ${{ inputs.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "ref=${MANUAL_REF:-master}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.ref }}
          fetch-depth: 0

      - name: Validate deployment configuration
        run: |
          missing=0
          for name in DOCKHAND_URL DOCKHAND_ENV_ID DOCKHAND_GIT_STACK_ID DOCKHAND_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured in the production environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Wait for CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          for attempt in {1..30}; do
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" --jq '[.check_runs[] | select(.name == "Analyze (C#)")][0].conclusion // "pending"')
            if [[ "$conclusion" == "success" ]]; then exit 0; fi
            if [[ "$conclusion" != "pending" && "$conclusion" != "null" && "$conclusion" != "" ]]; then
              echo "::error::CodeQL concluded with $conclusion."
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for CodeQL."
          exit 1

      - name: Calculate release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          mapfile -t labels < <(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" --jq '.[0].labels[].name' 2>/dev/null || true)
          args=()
          for label in "${labels[@]}"; do args+=(--label "$label"); done
          version=$(python .github/scripts/next_version.py --latest-tag "$latest_tag" "${args[@]}")
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "full_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.full_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve rollback image
        id: rollback
        run: |
          if [[ -z "${{ steps.version.outputs.latest_tag }}" ]] && docker buildx imagetools inspect "$IMAGE:rollback-bootstrap" >/dev/null 2>&1; then
            raw=$(docker buildx imagetools inspect "$IMAGE:rollback-bootstrap" --raw)
            digest="sha256:$(printf '%s' "$raw" | sha256sum | awk '{print $1}')"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if docker buildx imagetools inspect "$IMAGE:stable" >/dev/null 2>&1; then
            raw=$(docker buildx imagetools inspect "$IMAGE:stable" --raw)
            digest="sha256:$(printf '%s' "$raw" | sha256sum | awk '{print $1}')"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git worktree add /tmp/bridgearr-previous HEAD^
          docker buildx build --platform linux/amd64,linux/arm64 --push --tag "$IMAGE:rollback-bootstrap" /tmp/bridgearr-previous
          raw=$(docker buildx imagetools inspect "$IMAGE:rollback-bootstrap" --raw)
          digest="sha256:$(printf '%s' "$raw" | sha256sum | awk '{print $1}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Promote candidate to stable
        run: docker buildx imagetools create --tag "$IMAGE:stable" "$IMAGE:sha-${{ steps.version.outputs.short_sha }}"

      - name: Sync and deploy Dockhand stack
        run: |
          response=$(curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $DOCKHAND_TOKEN" --header "Accept: application/json" "$DOCKHAND_URL/api/git/stacks/$DOCKHAND_GIT_STACK_ID/deploy?env=$DOCKHAND_ENV_ID")
          echo "$response" | jq -e '.success == true' >/dev/null

      - name: Verify BridgeArr health
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_health_failure }}
        run: |
          if [[ "$SIMULATE_FAILURE" == "true" ]]; then
            echo "::error::Simulating a failed healthcheck to exercise rollback."
            exit 1
          fi
          for attempt in {1..30}; do
            containers=$(curl --fail --silent --show-error --header "Authorization: Bearer $DOCKHAND_TOKEN" "$DOCKHAND_URL/api/containers?env=$DOCKHAND_ENV_ID")
            if echo "$containers" | jq -e --arg image "$IMAGE:stable" 'any(.[]; .labels["com.docker.compose.project"] == "bridgearr" and .labels["com.docker.compose.service"] == "bridgearr" and .image == $image and .health == "healthy")' >/dev/null; then exit 0; fi
            sleep 10
          done
          echo "::error::Dockhand did not report the expected BridgeArr stable image as healthy within five minutes."
          exit 1

      - name: Publish immutable tags
        if: success()
        run: |
          candidate="$IMAGE:sha-${{ steps.version.outputs.short_sha }}"
          docker buildx imagetools create --tag "$IMAGE:${{ steps.version.outputs.version }}" "$candidate"
          docker buildx imagetools create --tag "$IMAGE:latest" "$candidate"

      - name: Create GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.version }}" --target "$(git rev-parse HEAD)" --generate-notes

      - name: Roll back failed deployment
        if: failure() && steps.rollback.outputs.digest != ''
        run: |
          docker buildx imagetools create --tag "$IMAGE:stable" "$IMAGE@${{ steps.rollback.outputs.digest }}"
          response=$(curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer $DOCKHAND_TOKEN" --header "Accept: application/json" "$DOCKHAND_URL/api/git/stacks/$DOCKHAND_GIT_STACK_ID/deploy?env=$DOCKHAND_ENV_ID")
          echo "$response" | jq -e '.success == true' >/dev/null
          for attempt in {1..30}; do
            containers=$(curl --fail --silent --show-error --header "Authorization: Bearer $DOCKHAND_TOKEN" "$DOCKHAND_URL/api/containers?env=$DOCKHAND_ENV_ID")
            if echo "$containers" | jq -e --arg image "$IMAGE:stable" 'any(.[]; .labels["com.docker.compose.project"] == "bridgearr" and .labels["com.docker.compose.service"] == "bridgearr" and .image == $image and .health == "healthy")' >/dev/null; then
              echo "Rollback completed successfully."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Rollback did not restore a healthy BridgeArr instance."
          exit 1
