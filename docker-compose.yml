services:
  bridgearr:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BRIDGEARR_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Serilog__MinimumLevel__Default: Information
      Serilog__MinimumLevel__Override__Microsoft: Warning
      Serilog__MinimumLevel__Override__System: Warning
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      RADARR_URL: ${RADARR_URL:-}
      RADARR_APIKEY: ${RADARR_APIKEY:-}
      SONARR_URL: ${SONARR_URL:-}
      SONARR_APIKEY: ${SONARR_APIKEY:-}
    volumes:
      - bridgearr_logs:/app/logs
      - bridgearr_keys:/app/dataprotection
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.bridgearr.rule=Host(`${BRIDGEARR_HOST:-bridgearr.localhost}`)"
      - "traefik.http.routers.bridgearr.entrypoints=websecure"
      - "traefik.http.routers.bridgearr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bridgearr.service=bridgearr"
      - "traefik.http.routers.bridgearr-http.rule=Host(`${BRIDGEARR_HOST:-bridgearr.localhost}`)"
      - "traefik.http.routers.bridgearr-http.entrypoints=web"
      - "traefik.http.routers.bridgearr-http.middlewares=redirect-to-https@file"
      - "traefik.http.services.bridgearr.loadbalancer.server.port=8080"
    networks:
      - default
      - traefik
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  bridgearr_logs:
  bridgearr_keys:

networks:
  traefik:
    external: true
